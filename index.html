<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stankyleg</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', sans-serif;
            text-align: center;
            background: #ffffff;
            color: #000;
            margin: 0;
            padding: 0;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-1/cur34.cur'), auto;
        }
        h1 {
            font-size: 3rem;
            text-transform: lowercase;
            color: #000;
        }
        .finder-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            max-width: 800px;
            background: #d9d9d9;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);
        }
        .finder-titlebar {
            display: flex;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
            width: 100%;
        }
        .finder-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }
        .finder-item {
            width: 120px;
            text-align: center;
        }
        .finder-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #000;
            background: #fff;
            padding: 5px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }
        .modal-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .control-button {
            padding: 8px 12px;
            background: #c0c0c0;
            border: 2px solid #000;
            cursor: pointer;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const finderContent = document.querySelector(".finder-content");
            const modal = document.createElement("div");
            modal.classList.add("modal");
            const modalImg = document.createElement("img");
            const controlsDiv = document.createElement("div");
            controlsDiv.classList.add("modal-controls");
            
            const imageFiles = [
                "2TDXMeY8.webp", "000049310011.webp", "000049310016.webp", "000049310022.webp",
                "000049310028.webp", "000049310029.webp", "000049310033.webp", "bkWweT-U.webp",
                "fIFTLJxY.webp", "HO3hKUzI.webp", "iGTjj7wg.webp", "JyK21jKU.webp",
                "MaxspS5I.webp", "nLWlXSUc.webp", "oPFnLqOY.webp", "pgx8bAXY.webp",
                "qVPbXMno.webp", "qZ64hPi4.webp", "s5t_gCQs.webp", "sff4JKqo.webp",
                "SjuUGldM.webp", "u-yKrfnY.webp"
            ];
            
            imageFiles.forEach((file, index) => {
                let item = document.createElement("div");
                item.classList.add("finder-item");
                
                let img = document.createElement("img");
                img.src = "images/" + file;
                img.alt = file;
                img.loading = "lazy";
                
                item.appendChild(img);
                finderContent.appendChild(item);
                
                img.addEventListener("click", function () {
                    modalImg.src = this.src;
                    modal.style.display = "flex";
                });
            });
            
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        });
    </script>
</head>
<body>
    <div style="padding: 10px;">
        <h1>stankyleg</h1>
        <p>By Indigo</p>
        <div class="finder-container">
            <div class="finder-titlebar">Finder - Images</div>
            <div class="finder-content"></div>
        </div>
    </div>
</body>
</html>
