<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANKYLEG</title>
    <style>
        body {
            font-family: "MingLiU", serif;
            text-align: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-family: "MingLiU", serif;
            font-size: 3rem;
            text-transform: uppercase;
            color: #000;
        }
        .finder-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            margin: auto;
            background: #d9d9d9;
            border: 2px solid #000;
            padding: 10px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .finder-toolbar {
            display: flex;
            justify-content: space-between;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
        }
        .finder-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            padding: 10px;
        }
        .finder-item {
            width: 120px;
            text-align: center;
            margin: 10px;
        }
        .finder-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #000;
            background: #fff;
            padding: 5px;
        }
        .finder-item span {
            display: block;
            font-size: 12px;
            margin-top: 5px;
            color: #000;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
        .modal.active {
            display: flex;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const imageFiles = [
                "2TDXMeY8.webp",
                "000049310011.webp",
                "000049310016.webp",
                "000049310022.webp",
                "000049310028.webp",
                "000049310029.webp",
                "000049310033.webp",
                "bkWweT-U.webp",
                "fIFTLJxY.webp",
                "HO3hKUzI.webp",
                "iGTjj7wg.webp",
                "JyK21jKU.webp",
                "MaxspS5I.webp",
                "nLWlXSUc.webp",
                "oPFnLqOY.webp",
                "pgx8bAXY.webp",
                "qVPbXMno.webp",
                "qZ64hPi4.webp",
                "s5t_gCQs.webp",
                "sff4JKqo.webp",
                "SjuUGldM.webp",
                "u-yKrfnY.webp"
            ];
            
            const finderContent = document.querySelector(".finder-content");
            const modal = document.createElement("div");
            modal.classList.add("modal");
            const modalImg = document.createElement("img");
            modal.appendChild(modalImg);
            document.body.appendChild(modal);

            imageFiles.forEach(file => {
                let item = document.createElement("div");
                item.classList.add("finder-item");
                
                let img = document.createElement("img");
                img.src = "images/" + file;
                img.alt = file;
                img.loading = "lazy";
                
                let label = document.createElement("span");
                label.textContent = file;
                
                item.appendChild(img);
                item.appendChild(label);
                
                img.addEventListener("click", function () {
                    modalImg.src = this.src;
                    modal.classList.add("active");
                });
                
                finderContent.appendChild(item);
            });

            modal.addEventListener("click", function () {
                modal.classList.remove("active");
            });
        });
    </script>
</head>
<body>
    <div style="padding: 10px;">
        <h1>STANKYLEG</h1>
        <p>By Indigo</p>
        <div class="finder-container">
            <div class="finder-toolbar">Finder - Images</div>
            <div class="finder-content"></div>
        </div>
    </div>
</body>
</html>
