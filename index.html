<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stankyleg</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', sans-serif;
            text-align: center;
            background: #ffffff;
            color: #000;
            margin: 0;
            padding: 0;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-1/cur34.cur'), auto;
            overflow-x: hidden;
        }
        h1 {
            font-size: 3rem;
            text-transform: lowercase;
            color: #000;
        }
        .finder-container {
            position: relative;
            margin: 10% auto;
            width: 90%;
            max-width: 800px;
            background: #d9d9d9;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);
            min-height: 60vh;
            overflow-y: auto;
        }
        .finder-titlebar {
            display: flex;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
            width: 100%;
        }
        .finder-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }
        .finder-item {
            width: 120px;
            text-align: center;
        }
        .finder-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #000;
            background: #fff;
            padding: 5px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 70%;
            max-height: 70%;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out;
            position: relative;
            z-index: 5;
        }
        .modal-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            position: absolute;
            bottom: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        .control-button {
            padding: 6px 14px;
            background: #d4d0c8;
            border: 2px solid #000;
            cursor: pointer;
            font-family: 'VT323', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px #8b8b8b;
            outline: none;
        }
        .control-button:active {
            box-shadow: inset 2px 2px 0px #8b8b8b;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            
            const finderContent = document.querySelector(".finder-content");
            const modal = document.querySelector(".modal");
            const modalImg = document.querySelector("#modal-image");
            const prevButton = document.querySelector("#prev-button");
            const nextButton = document.querySelector("#next-button");
            const rotateButton = document.querySelector("#rotate-button");
            let currentIndex = 0;
            let rotation = 0;
            
            const imageFiles = [
                "2TDXMeY8.webp", "000049310011.webp", "000049310016.webp", "000049310022.webp",
                "000049310028.webp", "000049310029.webp", "000049310033.webp", "bkWweT-U.webp",
                "fIFTLJxY.webp", "HO3hKUzI.webp", "iGTjj7wg.webp", "JyK21jKU.webp",
                "MaxspS5I.webp", "nLWlXSUc.webp", "oPFnLqOY.webp", "pgx8bAXY.webp",
                "qVPbXMno.webp", "qZ64hPi4.webp", "s5t_gCQs.webp", "sff4JKqo.webp",
                "SjuUGldM.webp", "u-yKrfnY.webp"
            ];
            
            function updateModalImage() {
                modalImg.src = "images/" + imageFiles[currentIndex];
                rotation = 0;
                modalImg.style.transform = "rotate(0deg)";
            }

            imageFiles.forEach((file, index) => {
                
            });
            
            // Lazy Loading using Intersection Observer
            const lazyImages = document.querySelectorAll(".lazy-image");
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        let img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove("lazy-image");
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: "50px" });
            
            lazyImages.forEach(img => {
                observer.observe(img);
            });

            // Lazy Loading using Intersection Observer
            const lazyImages = document.querySelectorAll(".lazy-image");
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        let img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove("lazy-image");
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: "50px" });
            
            lazyImages.forEach(img => {
                observer.observe(img);
            });
                
                
                img.addEventListener("click", function () {
                    currentIndex = index;
                    updateModalImage();
                    modal.style.display = "flex";
                });
            });
            
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });

            prevButton.addEventListener("click", function () {
                currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
                updateModalImage();
            });

            nextButton.addEventListener("click", function () {
                currentIndex = (currentIndex + 1) % imageFiles.length;
                updateModalImage();
            });

            rotateButton.addEventListener("click", function () {
                rotation = (rotation + 90) % 360;
                modalImg.style.transform = `rotate(${rotation}deg)`;
            });
        });
            document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
        document.addEventListener("dragstart", function (event) {
            event.preventDefault();
        });
    </script>
</head>
<body>
    <div style="padding: 10px;">
        <h1>stankyleg</h1>
        <p>By Indigo</p>
        <div class="finder-container">
            <div class="finder-titlebar">
                
                
                
                
                <span>Finder - Images</span>
            </div>
            <div class="finder-content"></div>
        </div>
    </div>
    <div class="modal">
        <img id="modal-image" src="" alt="">
        <div class="modal-controls">
            <button class="control-button" id="prev-button">Previous</button>
            <button class="control-button" id="rotate-button">Rotate</button>
            <button class="control-button" id="next-button">Next</button>
        </div>
    </div>
</body>
</html>
