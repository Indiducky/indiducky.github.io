<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stankyleg</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', sans-serif;
            text-align: center;
            background: #c3c3c3;
            color: #000;
            margin: 0;
            padding: 0;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-1/cur34.cur'), auto;
        }
        
        /* Mac OS Style Menu Bar */
        .menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #d4d0c8;
            padding: 5px 15px;
            font-size: 14px;
            border-bottom: 2px solid #888;
        }
        .menu-bar .menu {
            display: flex;
            gap: 15px;
        }
        .apple-logo {
            font-size: 16px;
            font-weight: bold;
        }
        .menu-item {
            cursor: pointer;
        }
        
        /* Finder Window */
        .finder-container {
            position: relative;
            margin: 40px auto;
            width: 80%;
            max-width: 800px;
            background: #d9d9d9;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);
            text-align: left;
        }
        .finder-titlebar {
            display: flex;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
            justify-content: space-between;
        }
        .finder-buttons {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }
        .finder-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #000;
            display: inline-block;
        }
        .close { background: red; }
        .minimize { background: yellow; }
        .maximize { background: green; }
        
        /* Finder Content */
        .finder-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }
        .finder-item {
            width: 120px;
            text-align: center;
        }
        .finder-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #000;
            background: #fff;
            padding: 5px;
            cursor: pointer;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 70%;
            max-height: 70%;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out;
            position: relative;
            z-index: 5;
        }
        .modal-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            position: absolute;
            bottom: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const finderContent = document.querySelector(".finder-content");
            const modal = document.createElement("div");
            modal.classList.add("modal");
            const modalImg = document.createElement("img");
            const controlsDiv = document.createElement("div");
            controlsDiv.classList.add("modal-controls");
            
            const sound = new Audio('https://www.myinstants.com/media/sounds/mac-os-error.mp3');

            function playMacSound() {
                sound.play();
            }

            const imageFiles = [
                "2TDXMeY8.webp", "000049310011.webp", "000049310016.webp", "000049310022.webp",
                "000049310028.webp", "000049310029.webp", "000049310033.webp", "bkWweT-U.webp"
            ];
            
            imageFiles.forEach((file, index) => {
                let item = document.createElement("div");
                item.classList.add("finder-item");
                
                let img = document.createElement("img");
                img.src = "images/" + file;
                img.alt = file;
                img.loading = "lazy";
                
                item.appendChild(img);
                finderContent.appendChild(item);
                
                img.addEventListener("click", function () {
                    modalImg.src = this.src;
                    modal.style.display = "flex";
                    playMacSound();
                });
            });
            
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        });
    </script>
</head>
<body>
    <div class="menu-bar">
        <div class="menu">
            <span class="apple-logo"></span>
            <span class="menu-item">Finder</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
        </div>
        <div class="menu-item">Help</div>
    </div>
    <div class="finder-container">
        <div class="finder-titlebar">
            <div class="finder-buttons">
                <div class="finder-button close"></div>
                <div class="finder-button minimize"></div>
                <div class="finder-button maximize"></div>
            </div>
            <span>Finder - Images</span>
        </div>
        <div class="finder-content"></div>
    </div>
</body>
</html>
