<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stankyleg</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', sans-serif;
            text-align: center;
            background: #ffffff;
            color: #000;
            margin: 0;
            padding: 0;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-1/cur34.cur'), auto;
        }
        h1 {
            font-size: 3rem;
            text-transform: lowercase;
            color: #000;
        }
        .finder-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; max-width: 800px;
            top: 50px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            margin: auto;
            background: #d9d9d9;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);
            cursor: move;
        }
        .finder-titlebar {
            display: flex;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
            width: 100%;
            cursor: grab;
        }
        .finder-buttons {
            display: flex;
            gap: 4px;
            margin-right: 8px;
        }
        .finder-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #000;
            display: inline-block;
        }
        .close { background: red; }
        .minimize { background: yellow; }
        .maximize { background: green; }
        .finder-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            padding: 10px;
            gap: 10px;
        }
        .finder-item {
            width: 120px;
            text-align: center;
        }
        .finder-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #000;
            background: #fff;
            padding: 5px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 60%;
            max-height: 60%;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out;
            position: relative;
            z-index: 5;
        }
        .modal.active {
            display: flex;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const finderContent = document.querySelector(".finder-content");
            const modal = document.createElement("div");
            modal.classList.add("modal");
            const modalImg = document.createElement("img");
            modal.appendChild(modalImg);
            const controlsDiv = document.createElement("div");
            controlsDiv.classList.add("modal-controls");
            controlsDiv.style.position = "relative";
            controlsDiv.style.zIndex = "10";

            const prevButton = document.createElement("button");
            prevButton.textContent = "Previous";
            prevButton.classList.add("control-button");
            prevButton.addEventListener("click", function () {
                currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
                updateModalImage();
            });

            const nextButton = document.createElement("button");
            nextButton.textContent = "Next";
            nextButton.classList.add("control-button");
            nextButton.addEventListener("click", function () {
                currentIndex = (currentIndex + 1) % imageFiles.length;
                updateModalImage();
            });

            const rotateButton = document.createElement("button");
            rotateButton.textContent = "Rotate";
            rotateButton.classList.add("control-button");
            let rotation = 0;
            rotateButton.addEventListener("click", function () {
                rotation = (rotation + 90) % 360;
                modalImg.style.transform = `rotate(${rotation}deg)`;
            });

            controlsDiv.appendChild(prevButton);
            controlsDiv.appendChild(rotateButton);
            controlsDiv.appendChild(nextButton);
            modal.appendChild(controlsDiv);
            document.body.appendChild(modal);

            const imageFiles = [
                "2TDXMeY8.webp", "000049310011.webp", "000049310016.webp", "000049310022.webp",
                "000049310028.webp", "000049310029.webp", "000049310033.webp", "bkWweT-U.webp",
                "fIFTLJxY.webp", "HO3hKUzI.webp", "iGTjj7wg.webp", "JyK21jKU.webp",
                "MaxspS5I.webp", "nLWlXSUc.webp", "oPFnLqOY.webp", "pgx8bAXY.webp",
                "qVPbXMno.webp", "qZ64hPi4.webp", "s5t_gCQs.webp", "sff4JKqo.webp",
                "SjuUGldM.webp", "u-yKrfnY.webp"
            ];
            
            let currentIndex = 0;

            function updateModalImage() {
                modalImg.src = "images/" + imageFiles[currentIndex];
                rotation = 0;
                modalImg.style.transform = "rotate(0deg)";
            }

            imageFiles.forEach((file, index) => {
                let item = document.createElement("div");
                item.classList.add("finder-item");
                
                let img = document.createElement("img");
                img.src = "images/" + file;
                img.alt = file;
                img.loading = "lazy";
                
                let label = document.createElement("span");
                const randomUnicode = () => {
                    let chars = [];
                    for (let i = 0; i < 6; i++) {
                        chars.push(String.fromCharCode(0x2500 + Math.floor(Math.random() * 96))); 
                    }
                    return chars.join('');
                };
                const randomExtensions = [".bin", ".dat", ".sys", ".cfg", ".tmp"];
                let randomLabel = randomUnicode() + randomExtensions[Math.floor(Math.random() * randomExtensions.length)];
                label.textContent = randomLabel;
                
                item.appendChild(img);
                item.appendChild(label);
                finderContent.appendChild(item);
                
                img.addEventListener("click", function () {
                    currentIndex = index;
                    updateModalImage();
                    modalImg.src = this.src;
                    modal.classList.add("active");
                });
            });
            
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.classList.remove("active");
                }
            });
        });
            document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
        document.addEventListener("dragstart", function (event) {
            event.preventDefault();
        });
    </script>
</head>
<body>
    <div style="padding: 10px;">
        <h1>stankyleg</h1>
        <p>By Indigo</p>
        <div class="finder-container">
            <div class="finder-titlebar">
                <div class="finder-buttons">
                    <div class="finder-button close"></div>
                    <div class="finder-button minimize"></div>
                    <div class="finder-button maximize"></div>
                </div>
                <span>Finder - Images</span>
            </div>
            <div class="finder-content"></div>
        </div>
    </div>
</body>
</html>
