<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stankyleg</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', sans-serif;
            text-align: center;
            background: repeating-linear-gradient(
                45deg,
                #ccc,
                #ccc 10px,
                #ddd 10px,
                #ddd 20px
            );
            color: #000;
            margin: 0;
            padding: 0;
            cursor: url('https://cur.cursors-4u.net/cursors/cur-1/cur34.cur'), auto;
        }
        h1 {
            font-size: 3rem;
            text-transform: lowercase;
            color: #000;
        }
        .finder-container {
            position: absolute;
            top: 50px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            margin: auto;
            background: #d9d9d9;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.4);
            cursor: move;
        }
        .finder-titlebar {
            display: flex;
            align-items: center;
            background: #c0c0c0;
            padding: 5px;
            border-bottom: 2px solid #000;
            width: 100%;
            cursor: grab;
        }
        .finder-buttons {
            display: flex;
            gap: 4px;
            margin-right: 8px;
        }
        .finder-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #000;
            display: inline-block;
        }
        .close { background: red; }
        .minimize { background: yellow; }
        .maximize { background: green; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }
        .modal-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .control-button {
            padding: 8px 12px;
            background: #c0c0c0;
            border: 2px solid #000;
            cursor: pointer;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const finder = document.querySelector('.finder-container');
            let isDragging = false, offsetX, offsetY;

            finder.addEventListener('mousedown', function (e) {
                isDragging = true;
                offsetX = e.clientX - finder.offsetLeft;
                offsetY = e.clientY - finder.offsetTop;
            });
            document.addEventListener('mousemove', function (e) {
                if (isDragging) {
                    finder.style.left = `${e.clientX - offsetX}px`;
                    finder.style.top = `${e.clientY - offsetY}px`;
                }
            });
            document.addEventListener('mouseup', function () { isDragging = false; });
        });
    </script>
</head>
<body>
    <div class="loading-indicator"></div>
    <div style="padding: 10px;">
        <h1>stankyleg</h1>
        <p>By Indigo</p>
        <div class="finder-container">
            <div class="finder-titlebar">
                <div class="finder-buttons">
                    <div class="finder-button close"></div>
                    <div class="finder-button minimize"></div>
                    <div class="finder-button maximize"></div>
                </div>
                <span>Finder - Images</span>
            </div>
            <div class="finder-content"></div>
        </div>
    </div>
</body>
</html>
