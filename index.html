<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANKYLEG</title>
    <style>
        body {
            font-family: "MingLiU", serif;
            text-align: center;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-family: "MingLiU", serif;
            font-size: 3rem;
            text-transform: uppercase;
            color: #000;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: auto;
            max-width: 30%;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, z-index 0.3s ease-in-out;
            user-drag: none;
            -webkit-user-drag: none;
            cursor: pointer;
            position: relative;
        }
        .gallery img:hover {
            transform: scale(1.1);
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }
        .rotate-90 {
            transform: rotate(-90deg);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
        .modal.active {
            display: flex;
        }
        .modal img.rotate-90 {
            transform: rotate(-90deg);
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const imageFiles = [
                "2TDXMeY8.webp",
                "000049310011.webp",
                "000049310016.webp",
                "000049310022.webp",
                "000049310028.webp",
                "000049310029.webp",
                "000049310033.webp",
                "bkWweT-U.webp",
                "fIFTLJxY.webp",
                "HO3hKUzI.webp",
                "iGTjj7wg.webp",
                "JyK21jKU.webp",
                "MaxspS5I.webp",
                "nLWlXSUc.webp",
                "oPFnLqOY.webp",
                "pgx8bAXY.webp",
                "qVPbXMno.webp",
                "qZ64hPi4.webp",
                "s5t_gCQs.webp",
                "sff4JKqo.webp",
                "SjuUGldM.webp",
                "u-yKrfnY.webp"
            ];
            const rotatedImages = [
                "000049310016.webp",
                "000049310022.webp",
                "000049310028.webp",
                "000049310029.webp",
                "000049310033.webp",
                "JyK21jKU.webp",
                "pgx8bAXY.webp"
            ];
            
            const gallery = document.querySelector(".gallery");
            const modal = document.createElement("div");
            modal.classList.add("modal");
            const modalImg = document.createElement("img");
            modal.appendChild(modalImg);
            document.body.appendChild(modal);

            imageFiles.forEach(file => {
                let img = document.createElement("img");
                img.src = "images/" + file;
                img.alt = "Photo";
                img.loading = "lazy";

                if (rotatedImages.includes(file)) {
                    img.classList.add("rotate-90");
                }

                img.addEventListener("click", function () {
                    modalImg.src = this.src;
                    if (rotatedImages.includes(file)) {
                        modalImg.classList.add("rotate-90");
                    } else {
                        modalImg.classList.remove("rotate-90");
                    }
                    modal.classList.add("active");
                });
                gallery.appendChild(img);
            });

            modal.addEventListener("click", function () {
                modal.classList.remove("active");
                modalImg.classList.remove("rotate-90");
            });
        });
    </script>
</head>
<body>
    <div style="padding: 10px;">
    <h1>STANKYLEG</h1>
    <p>By Indigo</p>
    <div class="gallery"></div>
    </div>
</body>
</html>
